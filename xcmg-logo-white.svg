<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 52" role="img" aria-label="XCMG Logo">
  <!-- Hexagon icon -->
  <g transform="translate(0,2)">
    <!-- Outer hexagon rounded square -->
    <rect x="1" y="1" width="46" height="46" rx="8" ry="8" fill="none" stroke="white" stroke-width="3"/>
    <!-- Inner diamond/hexagon shape -->
    <polygon points="24,8 38,16 38,32 24,40 10,32 10,16" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Inner triangle pointing down -->
    <polygon points="24,14 35,28 13,28" fill="white"/>
    <!-- Top triangle pointing up (outline only) -->
    <polygon points="24,34 35,20 13,20" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- XCMG text -->
  <text x="58" y="38" 
    font-family="Arial Black, Arial, sans-serif" 
    font-weight="900" 
    font-size="34" 
    fill="white" 
    letter-spacing="-1">XCMG</text>
</svg>